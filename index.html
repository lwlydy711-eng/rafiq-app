<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رفيق — متابعتي اليومية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#17252f}
header{background:#075b4d;color:white;padding:25px 18px;border-radius:0 0 25px 25px}
h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.85}
main{padding:18px;padding-bottom:85px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #0000000d}
.progress{height:12px;background:#e4e9e7;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#0b806d;width:0%;transition:.3s}
.habit{display:flex;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid #eee}
.habit:last-child{border:0}
.check{width:28px;height:28px;border:2px solid #0b806d;border-radius:9px;background:white;font-size:18px}
.done .check{background:#0b806d;color:white}
.done .name{text-decoration:line-through;opacity:.55}
button{border:0;border-radius:12px;padding:12px 16px;background:#075b4d;color:white;font-size:15px}
.add{width:100%;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 5px;box-shadow:0 -3px 15px #0002}
nav button{background:transparent;color:#555;padding:8px;font-size:13px}
nav button.active{color:#075b4d;font-weight:bold}
.stat{display:inline-block;width:48%;text-align:center;background:#f1f5f3;border-radius:15px;padding:15px;margin:1%}
.big{font-size:28px;font-weight:bold;color:#075b4d}
textarea,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:7px 0;font-size:15px}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>رفيق</h1>
<p>متابعتي اليومية — خطوة صغيرة كل يوم</p>
</header>

<main>

<section id="home">
<div class="card">
<h2>يومي</h2>
<p id="date"></p>
<p>نسبة الإنجاز: <b id="percent">0%</b></p>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="card">
<h3>عادات اليوم</h3>
<div id="habits"></div>
<button class="add" onclick="addHabit()">＋ إضافة عادة</button>
</div>

<div class="card">
<h3>📝 مراجعة اليوم</h3>
<textarea id="achievement" placeholder="أهم إنجاز اليوم"></textarea>
<textarea id="weakness" placeholder="ما الذي قصّرت فيه؟"></textarea>
<textarea id="tomorrow" placeholder="أهم مهمة غدًا"></textarea>
<button onclick="saveReview()">حفظ المراجعة</button>
</div>
</section>

<section id="stats" class="hidden">
<div class="card">
<h2>📊 الإحصائيات</h2>
<div class="stat"><div class="big" id="todayDone">0</div>عادات مكتملة</div>
<div class="stat"><div class="big" id="todayTotal">0</div>عادات اليوم</div>
<div class="stat"><div class="big" id="days">0</div>أيام مسجلة</div>
</div>
</section>

<section id="settings" class="hidden">
<div class="card">
<h2>⚙️ الإعدادات</h2>
<p>العادات الحالية:</p>
<div id="manage"></div>
<button class="add" onclick="addHabit()">＋ إضافة عادة جديدة</button>
</div>
</section>

</main>

<nav>
<button class="active" onclick="show('home',this)">🏠 يومي</button>
<button onclick="show('stats',this)">📊 الإحصائيات</button>
<button onclick="show('settings',this)">⚙️ الإعدادات</button>
</nav>

<script>
const defaults=[
"الصلاة والعبادة",
"القرآن 15 دقيقة",
"المشي",
"التمرين",
"المحاسبة",
"الذكاء الاصطناعي",
"العمل",
"النوم"
];

let habits=JSON.parse(localStorage.getItem("habits")||"null")||defaults;
let data=JSON.parse(localStorage.getItem("daily")||"{}");
let today=new Date().toISOString().slice(0,10);

if(!data[today]) data[today]={done:[],achievement:"",weakness:"",tomorrow:""};

document.getElementById("date").textContent=
new Date().toLocaleDateString("ar-YE",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

function save(){
localStorage.setItem("habits",JSON.stringify(habits));
localStorage.setItem("daily",JSON.stringify(data));
}

function render(){
let box=document.getElementById("habits");
box.innerHTML="";
habits.forEach((h,i)=>{
let d=data[today].done.includes(i);
box.innerHTML+=`
<div class="habit ${d?'done':''}">
<button class="check" onclick="toggle(${i})">${d?'✓':''}</button>
<span class="name">${h}</span>
</div>`;
});
let total=habits.length;
let done=data[today].done.length;
let p=total?Math.round(done/total*100):0;
document.getElementById("percent").textContent=p+"%";
document.getElementById("bar").style.width=p+"%";
document.getElementById("todayDone").textContent=done;
document.getElementById("todayTotal").textContent=total;

document.getElementById("manage").innerHTML=habits.map((h,i)=>
`<div class="habit"><span>${h}</span>
<button onclick="deleteHabit(${i})">حذف</button></div>`).join("");

document.getElementById("achievement").value=data[today].achievement||"";
document.getElementById("weakness").value=data[today].weakness||"";
document.getElementById("tomorrow").value=data[today].tomorrow||"";

let days=Object.keys(data).filter(x=>data[x].done.length>0).length;
document.getElementById("days").textContent=days;
}

function toggle(i){
let a=data[today].done;
let n=a.indexOf(i);
if(n>=0)a.splice(n,1);else a.push(i);
save();render();
}

function addHabit(){
let n=prompt("اكتب اسم العادة الجديدة:");
if(n&&n.trim()){
habits.push(n.trim());
save();render();
}
}

function deleteHabit(i){
if(confirm("هل تريد حذف هذه العادة؟")){
habits.splice(i,1);
save();render();
}
}

function saveReview(){
data[today].achievement=document.getElementById("achievement").value;
data[today].weakness=document.getElementById("weakness").value;
data[today].tomorrow=document.getElementById("tomorrow").value;
save();
alert("تم حفظ مراجعة اليوم ✅");
}

function show(id,btn){
document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
}

render();
</script>

</body>
</html>
